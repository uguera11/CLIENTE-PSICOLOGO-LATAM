  let memoryRows = JSON.parse(JSON.stringify(sample));
  const storage = {
    get() {
      try { return window.localStorage ? localStorage.getItem(KEY) : null; } catch (_) { return null; }
    },
    set(value) {
      try { if (window.localStorage) { localStorage.setItem(KEY, value); return true; } } catch (_) {}
      return false;
    }
  };

  const hasSupabase = !!(cfg.supabaseUrl && cfg.supabaseAnonKey && window.supabase && typeof window.supabase.createClient === 'function');
  let client = null;
  if (hasSupabase) {
    try { client = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey); } catch (e) { console.warn('Supabase no disponible:', e); }
  }

  const themeDefaults={themeInk:'#101820',themeInkSoft:'#25313a',themePaper:'#f7f7f4',themePaper2:'#eef0ee',themeAccent:'#33424f',themeWarm:'#ad8663',headingFont:'Cormorant Garamond',bodyFont:'Manrope',cornerStyle:'subtle'};
  function themeFont(name,kind){const safe=String(name||'').replace(/["']/g,'');return`"${safe}",${kind==='serif'?'Georgia,serif':'Arial,sans-serif'}`}
  function themeRgba(hex,a){const h=String(hex||'').replace('#','').trim();if(!/^[0-9a-f]{6}$/i.test(h))return`rgba(16,24,32,${a})`;const n=parseInt(h,16);return`rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`}
  function applyPublicTheme(s={}){s={...themeDefaults,...s};const r=document.documentElement.style;r.setProperty('--ink',s.themeInk);r.setProperty('--ink2',s.themeInkSoft);r.setProperty('--paper',s.themePaper);r.setProperty('--paper2',s.themePaper2);r.setProperty('--warm',s.themeWarm);r.setProperty('--line',themeRgba(s.themeInk,.13));r.setProperty('--serif',themeFont(s.headingFont,'serif'));r.setProperty('--sans',themeFont(s.bodyFont,'sans'));const radius=s.cornerStyle==='square'?'0px':s.cornerStyle==='rounded'?'18px':'3px';r.setProperty('--radius',radius);let st=document.getElementById('public-theme-overrides');if(!st){st=document.createElement('style');st.id='public-theme-overrides';document.head.appendChild(st)}st.textContent=`.btn,.course-card,.featured-course,.course-cover,.buy-box{border-radius:${radius}!important;overflow:hidden}`}
  async function loadPublicTheme(){if(!client)return;try{const {data,error}=await client.from('site_settings').select('data').eq('id','main').maybeSingle();if(error)throw error;applyPublicTheme(data?.data||{})}catch(e){console.warn('Tema:',e.message||e)}}
  loadPublicTheme();

  function clone(v) { return JSON.parse(JSON.stringify(v)); }
  function demoCourses() {
    const raw = storage.get();
    if (!raw) {
      storage.set(JSON.stringify(memoryRows));
      return clone(memoryRows);
    }
    try {
      const parsed = JSON.parse(raw);
      memoryRows = Array.isArray(parsed) ? parsed : clone(sample);
      return clone(memoryRows);
    } catch (_) {
      memoryRows = clone(sample);
      return clone(memoryRows);
    }
  }
  function saveDemo(courses) {
    memoryRows = clone(courses);
    storage.set(JSON.stringify(memoryRows));
  }
  const cleanSlug = s => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

  async function listCourses({publishedOnly=false}={}) {
    if (client) {
      let q = client.from('courses').select('*').order('featured',{ascending:false}).order('order_index',{ascending:true}).order('date',{ascending:true});
      if (publishedOnly) q = q.eq('status','published');
      const {data,error} = await q;
      if (error) throw error;
      return data || [];
    }
    let rows = demoCourses();
    if (publishedOnly) rows = rows.filter(x => x.status === 'published');
    return rows.sort((a,b)=>(Number(!!b.featured)-Number(!!a.featured)) || ((Number(a.order_index)||99)-(Number(b.order_index)||99)) || String(a.date||'').localeCompare(String(b.date||'')));
  }

  async function getCourse(slug) {
    if (!slug) return null;
    if (client) {
      const {data,error} = await client.from('courses').select('*').eq('slug',slug).maybeSingle();
      if (error) throw error;
      return data;
    }
    return demoCourses().find(x => x.slug === slug) || null;
  }

  async function upsertCourse(course) {
    course = {...course};
    course.slug = cleanSlug(course.slug || course.title);
    course.updated_at = new Date().toISOString();
    course.order_index = Number(course.order_index || 1);
    if (!course.status) course.status = 'draft';
    if (client) {
      const payload = {...course};
      if (!payload.id || String(payload.id).startsWith('demo-')) delete payload.id;
      const {data,error} = await client.from('courses').upsert(payload,{onConflict:'slug'}).select().single();
      if (error) throw error;
      return data;
    }
    const rows = demoCourses();
    const i = rows.findIndex(x => x.id === course.id || x.slug === course.slug);
    if (!course.id) course.id = 'demo-' + Date.now();
    if (!course.created_at) course.created_at = new Date().toISOString();
    if (i >= 0) rows[i] = course; else rows.push(course);
    saveDemo(rows);
    return clone(course);
  }

  async function deleteCourse(id) {
    if (client) {
      const {error} = await client.from('courses').delete().eq('id',id);
      if (error) throw error;
      return;
    }
    saveDemo(demoCourses().filter(x => x.id !== id));
  }

  async function setFeatured(id) {
    if (client) {
      const {error:e1} = await client.from('courses').update({featured:false}).neq('id','00000000-0000-0000-0000-000000000000');
      if (e1) throw e1;
      const {data,error} = await client.from('courses').update({featured:true,updated_at:new Date().toISOString()}).eq('id',id).select().single();
      if (error) throw error;
      return data;
    }
    const rows = demoCourses().map(x => ({...x,featured:x.id===id}));
    saveDemo(rows);
    return clone(rows.find(x=>x.id===id));
  }

  async function uploadImage(file, slug='course') {
    if (!file) return '';
    if (client) {
      const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
      const path=`${cleanSlug(slug)}-${Date.now()}.${ext}`;
      const bucket=cfg.storageBucket || 'course-images';
      const {error} = await client.storage.from(bucket).upload(path,file,{upsert:false,cacheControl:'3600'});
      if (error) throw error;
      return client.storage.from(bucket).getPublicUrl(path).data.publicUrl;
    }
    return await new Promise((resolve,reject)=>{
      const r=new FileReader();
      r.onload=()=>resolve(r.result);
      r.onerror=()=>reject(r.error || new Error('No se pudo leer la imagen.'));
      r.readAsDataURL(file);
    });
  }

  async function signIn(email,password) {
    if (!client) return {demo:true};
    const {data,error}=await client.auth.signInWithPassword({email,password});
    if(error) throw error;
    return data;
  }
  async function signOut(){ if(client) await client.auth.signOut(); }
  async function session(){ if(!client) return {demo:true}; const {data}=await client.auth.getSession(); return data.session; }

  window.CourseStore = {hasSupabase:!!client,client,listCourses,getCourse,upsertCourse,deleteCourse,setFeatured,uploadImage,signIn,signOut,session,cleanSlug};
})();
</script>
<script>
(()=>{
  'use strict';
  const root=document.getElementById('courseRoot');
  const esc=s=>String(s??'').replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
  const params=new URLSearchParams(location.search);
  let slug=params.get('slug')||'';
  if(!slug){const last=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'');if(last&&!/\.html?$/i.test(last)&&last!=='formacion')slug=last;}
  const fmt=v=>v?new Intl.DateTimeFormat('es-UY',{day:'2-digit',month:'long',year:'numeric'}).format(new Date(v+'T12:00:00')):'A confirmar';
  const shareUrl=()=>location.href.split('#')[0];
  async function copyText(text,button){try{await navigator.clipboard.writeText(text);button.textContent='Enlace copiado';}catch(_){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();button.textContent='Enlace copiado';}}
  async function render(){
    try{
      let c=slug?await CourseStore.getCourse(slug):null;
      if(!c){const rows=await CourseStore.listCourses({publishedOnly:true});c=rows.find(x=>x.featured)||rows[0]||null;}
      if(!c||c.status!=='published'){root.innerHTML='<div class="empty-state"><h2>Formación no disponible</h2><p>Esta formación todavía no está publicada o ya no se encuentra disponible.</p><a class="btn btn-dark" href="formacion.html">Ver otras formaciones</a></div>';return;}
      document.title=`${c.title} — Lic. Mauricio Berón`;
      document.querySelector('meta[name="description"]').content=c.short_description||c.description||'';

(()=>{'use strict';
  async function track(){
    const client=window.CourseStore&&CourseStore.client;
    if(!client)return;
    const key='mbv:'+location.pathname+location.search;
    try{if(sessionStorage.getItem(key))return;sessionStorage.setItem(key,'1')}catch(_){}
    const q=new URLSearchParams(location.search);
    let ref='';try{ref=document.referrer?new URL(document.referrer).hostname:''}catch(_){}
    const source=q.get('utm_source')||ref||'direct';
    try{await client.from('site_visits').insert({page:location.pathname||'/',source,medium:q.get('utm_medium')||null,campaign:q.get('utm_campaign')||null,referrer:ref||null})}catch(e){console.warn('Stats:',e.message||e)}
  }
  track();
})();
</script>
