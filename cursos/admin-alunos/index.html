<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accesos manuales | Cursos</title><meta name="robots" content="noindex,nofollow"><style>body{font-family:Arial,sans-serif;background:#f5f3f7;color:#211d25;margin:0;padding:30px}.box{max-width:620px;margin:auto;background:#fff;border:1px solid #ddd4e3;border-radius:18px;padding:26px}h1{font-size:24px}label{display:block;font-size:12px;font-weight:700;margin:14px 0 6px}input,select{width:100%;padding:12px;border:1px solid #d8cedf;border-radius:9px;box-sizing:border-box}button{margin-top:16px;padding:12px 14px;border:0;border-radius:9px;background:#17141b;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#fff;color:#17141b;border:1px solid #d8cedf;margin-left:6px}#msg{margin-top:14px;font-size:12px;line-height:1.5}</style></head><body><div class="box"><h1>Accesos manuales</h1><p>Para pagos por transferencia en Uruguay o pruebas. La clave administrativa queda guardada sólo en este navegador durante la sesión.</p><label>Clave administrativa</label><input id="key" type="password"><label>Nombre del alumno</label><input id="name"><label>Email</label><input id="email" type="email"><label>Curso</label><select id="course"><option value="conductas-sexuales-abusivas">Conductas Sexuales Abusivas entre Niños y Adolescentes</option><option value="entrevista-forense-presuntos-agresores-sexuales">Curso Entrevista Forense Presuntos Agresores Sexuales</option><option value="entrevista-forense-analisis-testimonio">Entrevista Forense y Análisis del Testimonio</option><option value="evaluacion-forense-victimologica-parentalidad">Evaluación Forense y Victimológica de la Parentalidad y Condiciones Parentales</option><option value="abordaje-neuropsicologico-forense-evaluacion-pericial">Introducción al Abordaje Neuropsicológico Forense en la Evaluación Pericial</option><option value="pericia-psicologica-forense">Master Class - Pericia Psicológica Forense</option><option value="evaluacion-psicologica-porte-tenencia-armas">Masterclass sobre Evaluación Psicológica para Porte y Tenencia de Armas</option><option value="trauma-disociacion-modelo-apego">Trauma y Disociación – Intervención desde el Modelo de Apego</option><option value="trauma-y-juego">Trauma y Juego</option><option value="victimologia-subjetividad-victima">Victimología, un enfoque centrado en la subjetividad de la víctima</option></select><button id="grant">Habilitar acceso</button><button class="secondary" id="revoke">Quitar acceso</button><div id="msg"></div></div><script>
async function act(active){const msg=document.getElementById('msg');msg.textContent='Procesando...';const r=await fetch('/api/manual-access',{method:'POST',headers:{'content-type':'application/json','x-admin-key':document.getElementById('key').value},body:JSON.stringify({email:document.getElementById('email').value.trim(),name:document.getElementById('name').value.trim(),courseId:document.getElementById('course').value,active})});const data=await r.json();msg.textContent=r.ok?(active?'Acceso habilitado. Si era un alumno nuevo, recibirá un email para crear la contraseña.':'Acceso retirado.'):'Error: '+(data.error||'No autorizado');}document.getElementById('grant').onclick=()=>act(true);document.getElementById('revoke').onclick=()=>act(false);
</script></body></html>
